[workspace]

members = [
    "crates/cli",
    "crates/worker",
        "crates/core",
    "crates/inference",
    "crates/network",
    "crates/storage",
    "crates/telemetry",
    "crates/api",
    "crates/ingress",
    "crates/node",
    "crates/protocol",
    # The `[patch.crates-io]` target at the bottom of this file: a member so that `cargo fmt --all`,
    # `clippy --all-targets -- -D warnings` and `test --workspace` cover it (TOOL-11). It is compiled
    # by every `cuda` build either way; as a *dependency* outside the workspace, cargo caps its lints
    # (`--cap-lints allow`) and rustfmt never sees it, so it could not fail the gate.
    "crates/candle-kernels",
]

resolver = "2"

[workspace.package]
# MSRV (`TOOL-13`, medido el 2026-09-30): el suelo lo fija el bloqueo de ficheros del sistema,
# `File::lock_shared` / `try_lock_shared` / `try_lock` y `std::fs::TryLockError`
# (`crates/worker/src/model_cache.rs`): todavía inestables en 1.88 y estabilizados en rustc **1.89**.
# Medido sobre este árbol con `cargo check --workspace --all-targets --locked`: con 1.88 salen 6
# `error[E0658]: use of unstable library feature 'file_lock'` (los seis desde `tessella-worker`, todos
# en `model_cache.rs`, `could not compile`); con 1.89 sale 0 (`Finished` en 1 m 39 s, en frío). Las
# dependencias no suben el suelo por encima de eso: `time 0.3.51` exige 1.88.0, `icu_* 2.2.0` exige
# 1.86 y `candle-*` 0.8.4 con `bindgen_cuda` compilan ya con 1.89. Lo declaran los once miembros
# hand-written: diez heredan este valor con `rust-version.workspace = true` y `crates/protocol` declara
# **1.87** explícito, porque `musivum` lo compila como dependencia de ruta y su promesa es 1.87.
# `crates/candle-kernels` queda fuera de esa declaración a propósito: su manifiesto es el vendorizado de
# upstream («AUTOMATICALLY GENERATED BY CARGO») y una re-vendorización la pisaría, así que el paso `msrv`
# de `scripts/dev/launcher.sh --gate` lo exime del control de declaración y lo sigue compilando con el
# toolchain declarado, como a cualquier otro miembro. Ese paso comprueba tres cosas: que cada miembro
# hand-written lo declare, que ninguno suba por encima del workspace y que el árbol entero compile con
# 1.89 (con 1.88 no compila).
rust-version = "1.89"

[workspace.dependencies]

anyhow = "1.0"
crc32fast = "1.4"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "signal", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.7.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rand = "0.8"
rkyv = { version = "0.7", features = ["validation", "bytecheck"] }
candle-core = { version = "0.8.4" }
candle-nn = { version = "0.8.4" }
candle-transformers = { version = "0.8.4" }
tokenizers = "0.19"
libp2p = { version = "0.53", features = ["tokio", "tcp", "noise", "yamux", "kad", "identify", "macros", "mdns", "gossipsub", "relay", "dcutr"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry", "ansi", "json"] }
tracing-appender = "0.2"
chrono = "0.4"
futures = "0.3"
futures-util = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
blake3 = "1.5"
bincode = "1"
half = "2"
safetensors = "0.4"
thiserror = "2.0"
sha2 = "0.10"
ed25519-dalek = "2.1"
url = "2.5"
dashmap = "5.5"
once_cell = "1.18"
subtle = "2.6"
hex = "0.4"
clap = { version = "4.5", features = ["derive"] }
bytecheck = "0.6.12"
dirs = "5"
toml = "0.8"
regex = "1.10"
local-ip-address = "0.6"
bytemuck = { version = "1", features = ["derive"] }
hf-hub = { version = "0.4", default-features = false, features = ["tokio", "rustls-tls"] }
memmap2 = "0.9"
uuid = { version = "1.8", features = ["v4", "serde"] }
dialoguer = "0.11"
colored = "2.1"
comfy-table = "7.1"


[profile.dev]
# Builds más ligeros (S30 / TASK-24). Lo que llena `target/` es la información de depuración de las
# **dependencias** (candle, libp2p, tokenizers, hf-hub…), no la del código propio: las dependencias
# se compilan con solo tablas de líneas (`-C debuginfo=1`), que bastan para que un backtrace apunte a
# `fichero:línea`, y los crates de este workspace conservan debug completo (`debug = 2`) para poder
# depurar con variables e inlining como siempre. Para volver al comportamiento anterior, borra
# `[profile.dev.package."*"]` y `[profile.test.package."*"]` y recompila en frío.
debug = 2

[profile.dev.package."*"]
debug = "line-tables-only"

[profile.test.package."*"]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
candle-kernels = { path = "crates/candle-kernels" }

