[package]
name = "tessella-core"
version = "0.0.1"
edition = "2024"
rust-version.workspace = true

[dependencies]
tessella-protocol = { path = "../protocol" }
rkyv.workspace = true
bytecheck.workspace = true
serde.workspace = true
thiserror.workspace = true
url.workspace = true
sha2.workspace = true
serde_json.workspace = true
ed25519-dalek.workspace = true
blake3.workspace = true
# `SOLID-89`: the token-stream capability registry (`callback::capability`) is process state shared
# by the engine and the router, so it moved here from `tessella-api` instead of dragging the HTTP
# crate into the data plane. `hex` prints the capability, `subtle` compares it in constant time.
hex.workspace = true
subtle.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait.workspace = true
anyhow.workspace = true
dashmap.workspace = true
once_cell.workspace = true
# S35 (`TASK-29`): the shared cancel-and-drain helper of `shutdown.rs` is the only runtime-aware
# code of this crate. It lives here because Musivum needs the identical policy and cannot depend
# on `tessella-worker`; both workspaces already compile `tokio`, so no crate is added to the tree.
tokio.workspace = true
tokio-util.workspace = true
rand.workspace = true
